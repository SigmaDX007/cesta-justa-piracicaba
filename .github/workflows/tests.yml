name: Cesta Justa - testes offline
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar sem dependencias externas
        run: python -m py_compile core.py server.py
      - name: Testes sinteticos offline
        run: python -m unittest discover -s tests -v
